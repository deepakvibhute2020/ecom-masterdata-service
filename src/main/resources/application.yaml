server:
  port: 8092
spring:
  application:
    name: ecom
  datasource:
    url: jdbc:mysql://localhost:3308/rvindb?createDatabaseIfNotExist=true
    username: ${DB_USERNAME:rvin}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update

management:
  server:
    port: 8092
  endpoints:
    web:
      exposure:
        include: health
