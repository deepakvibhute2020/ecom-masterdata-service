# Database: the existing Docker container (rvin-mysql-container, host port 3308) is reached from pods via host.minikube.internal.
# Secret (create once, never commit values):
#   kubectl -n ecom-test create secret generic ecom-db --from-literal=username=rvin --from-literal=password="<db password>"
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecom-masterdata-service
  namespace: ecom-test
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ecom-masterdata-service
  template:
    metadata:
      labels:
        app: ecom-masterdata-service
    spec:
      containers:
        - name: ecom-masterdata-service
          image: rvin2026/ecom-masterdata-service:0.0.1-SNAPSHOT
          imagePullPolicy: Always
          ports:
            - containerPort: 8092
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:mysql://host.minikube.internal:3308/rvindb?createDatabaseIfNotExist=true
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: ecom-db
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ecom-db
                  key: password
          resources:
            requests: { cpu: 250m, memory: 384Mi }
            limits: { memory: 768Mi }
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8092
            initialDelaySeconds: 30
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8092
            initialDelaySeconds: 60
---
# ClusterIP only: reached through the gateway (and by the auth service).
apiVersion: v1
kind: Service
metadata:
  name: ecom-masterdata-service
  namespace: ecom-test
spec:
  type: ClusterIP
  selector:
    app: ecom-masterdata-service
  ports:
    - port: 8092
      targetPort: 8092
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ecom-masterdata-service
  namespace: ecom-test
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ecom-masterdata-service
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
