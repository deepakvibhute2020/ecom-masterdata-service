spring:
  application:
    name: ecom
  datasource:
    url: jdbc:mysql://localhost:3308/rvindb?createDatabaseIfNotExist=true
    username: ${DB_USERNAME:rvin}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
server:
  port: 8090
management:
  server:
    port: 8091
  endpoints:
    web:
      exposure:
        include: health,openapi,swagger-ui
springdoc:
  use-management-port: true
  show-actuator: false
