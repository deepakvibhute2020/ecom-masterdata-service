server:
  port: 8092
spring:
  application:
    name: ecom
  datasource:
    url: jdbc:mysql://localhost:3308/rvindb?createDatabaseIfNotExist=true
    username: ${DB_USERNAME:rvin}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update

app:
  jwt:
    # Same Base64 secret (>= 32 bytes) and issuer the auth service signs tokens with.
    # Override with JWT_SECRET in real environments.
    secret: ${JWT_SECRET:ZWNvbS11c2VyYXV0aC1zZXJ2aWNlLWRldi1vbmx5LXNlY3JldC1rZXktMzItYnl0ZXM=}
    issuer: ecom-userauth-service

management:
  server:
    port: 8092
  endpoints:
    web:
      exposure:
        include: health
springdoc:
  api-docs:
    path: /api-docs
